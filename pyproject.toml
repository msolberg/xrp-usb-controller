[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xrp-usb-controller"
version = "0.3.0"
description = "Control an XRP robot over a USB serial connection."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Michael Solberg <mpsolberg@gmail.com>" },
]
dependencies = [
    "mpremote>=1.29.0",
    "packaging>=26.3",
]

[project.urls]
Homepage = "https://github.com/msolberg/xrp-usb-controller"

[tool.setuptools.packages.find]
where = ["src"]
